name: Build K-Beauty APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip KBeauty-Android-Studio-Project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd project
          WRAPPER=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          cd "$(dirname "$WRAPPER")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KBeauty-debug-apk
          path: project/**/*.apk
